# For the NAS, deployed by .github/workflows/deploy.yml (self-hosted runner on the NAS).
# The runner sets TAG and HOST_DATA_PATH; both have defaults for a manual run.
#
# Manual usage (in this folder on the NAS):
#   1. cp salem.env.example salem.env and fill it in
#   2. docker compose up -d --build

name: salem

services:
  salem:
    build:
      context: ..
      dockerfile: Dockerfile
    image: salem-server:${TAG:-latest}
    container_name: salem
    restart: unless-stopped
    env_file: salem.env
    environment:
      TZ: Asia/Taipei
      NODE_ENV: production
      PORT: '2567'
    volumes:
      # Replays of finished games. Bind-mounted from the NAS host so they survive
      # rebuilds; the directory must be writable by uid 1000 (the workflow does this).
      - ${HOST_DATA_PATH:-./data}:/app/data
    ports:
      # Published on a real host port: the NAS's shared cloudflared tunnel reaches
      # every tunneled service by NAS address:PORT. Add a Public Hostname in that
      # tunnel pointing at http://<NAS LAN IP>:25670 (no cloudflared service here).
      - '25670:2567'
    # Keep memory small so other NAS services aren't affected (no cpus: the NAS kernel lacks CFS support)
    mem_limit: 256m
    stop_grace_period: 15s
